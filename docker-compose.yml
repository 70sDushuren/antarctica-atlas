# ==============================================================================
# Antarctica Atlas V2.0 — Open-Source PostgreSQL + PostGIS + PgBouncer + BI Stack
#
# Quick Start (Core Spatial Database + Connection Pooler):
#   docker compose up -d
#
# Optional: Launch Open-Source Metabase & Grafana BI Dashboards locally:
#   docker compose --profile bi up -d
#   - Metabase UI: http://localhost:3001
#   - Grafana UI:  http://localhost:3002 (default login: admin / admin)
# ==============================================================================

services:
  postgis:
    image: postgis/postgis:17-3.5-alpine
    container_name: antarctica-atlas-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_polar_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-antarctica_atlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts/db/init-postgis-and-views.sql:/docker-entrypoint-initdb.d/01-init-postgis-and-views.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=120"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-antarctica_atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: antarctica-atlas-pgbouncer
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_polar_dev_2026}@postgis:5432/${POSTGRES_DB:-antarctica_atlas}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 400
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"

  metabase:
    image: metabase/metabase:latest
    container_name: antarctica-atlas-metabase
    profiles: ["bi"]
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      JAVA_OPTS: "-Xmx768m"
    volumes:
      - metabase_data:/metabase-data

  grafana:
    image: grafana/grafana-oss:latest
    container_name: antarctica-atlas-grafana
    profiles: ["bi"]
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgis_data:
  metabase_data:
  grafana_data:
